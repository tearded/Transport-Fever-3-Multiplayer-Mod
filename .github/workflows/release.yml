name: release

# Builds separate player and server packages for every platform. The player
# package contains the launcher window, agent, mod and in-game hook. Runs by hand, which
# leaves the packages as workflow artifacts, or on a push to `main`, the
# release branch (see AGENTS.md), which also attaches them to a draft
# release of the workspace's version, to review before publishing.
#
# Repository variables it builds in (Settings, Secrets and variables,
# Actions, Variables):
# - TPF3MP_DEFAULT_SERVER: the launcher's default server
#   (docs/DECISIONS.md, D12, and its proposed amendment: players may change
#   it in Settings; invites never do). A build without it falls back to the
#   project's relay coded in the launcher, but a release names its server on
#   purpose, so no release is drafted without it;
# - TPF3MP_SERVER_NAME: what players see of that server, such as EU, in
#   place of its address;
# - TPF3MP_UPDATE_PUBLIC_KEY: the public keys updates must be signed with.
#   Without one the launcher never updates itself, so no release is
#   drafted: manual runs still build packages to try.
# - TPF3MP_GAME_ARCHIVE: a complete private tpfre archive on the dedicated
#   self-hosted Windows runner labelled `tpf3mp-game-builds`. Missing input
#   or a failed check stops every package, including manual workflow runs.
#
# It signs nothing: publishing a release starts sign.yml, which signs it
# for the updater in the protected `release` environment. Actions are
# pinned to commits, since what this builds gets signed.
#
# The hook library goes next to the launcher, which loads it into the game
# it starts and nowhere else (docs/DECISIONS.md, D11): the package puts
# nothing in the game's folder.
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Check the selected game build without creating packages
        type: boolean
        default: false
  push:
    branches: [dev, acceptance, main, 'feat/game-update-*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::cannot read the workspace version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require private game verification configuration
        env:
          TPF3MP_GAME_ARCHIVE: ${{ vars.TPF3MP_GAME_ARCHIVE }}
        run: |
          if [ -z "$TPF3MP_GAME_ARCHIVE" ]; then
            echo "::error::Set TPF3MP_GAME_ARCHIVE to the complete private archive on the tpf3mp-game-builds runner (docs/DEVELOPMENT.md, Game update builds). No package is built without verification."
            exit 1
          fi

  game-build:
    name: verify selected game build
    needs: version
    runs-on: [self-hosted, Windows, X64, tpf3mp-game-builds]
    timeout-minutes: 30
    env:
      TPF3MP_GAME_ARCHIVE: ${{ vars.TPF3MP_GAME_ARCHIVE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify the compiled native bundle against the private archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path target -Force | Out-Null
          $reportPath = Join-Path $pwd 'target/game-build-verification.json'
          Remove-Item -LiteralPath $reportPath -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path -LiteralPath $env:TPF3MP_GAME_ARCHIVE -PathType Container)) {
            throw 'Missing private source archive; no package is built'
          }
          $quietCargo = Join-Path $env:USERPROFILE '.claude/tools/quiet-cargo/quiet-cargo.cmd'
          if (-not (Test-Path -LiteralPath $quietCargo -PathType Leaf)) {
            throw 'Install quiet-cargo on the private runner before enabling game verification'
          }
          # Windows PowerShell treats native stderr as errors; Cargo progress
          # is stderr too. Check the exit code explicitly before verification.
          $ErrorActionPreference = 'Continue'
          & $quietCargo build --release --locked --manifest-path tools/tpfre/Cargo.toml -j 2
          $buildExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($buildExit -ne 0) { throw 'Could not build the game verification tool' }
          $report = & ./tools/tpfre/target/release/tpfre.exe verify-build --repo . --archive $env:TPF3MP_GAME_ARCHIVE --json
          $verificationExit = $LASTEXITCODE
          if ($report.Count -gt 0) {
            [System.IO.File]::WriteAllLines($reportPath, [string[]]$report, [System.Text.UTF8Encoding]::new($false))
          }
          if ($verificationExit -ne 0) { throw 'Selected game build verification failed; no package is built; inspect the static report artifact when available' }
          $verification = ($report -join "`n") | ConvertFrom-Json
          if ($verification.source_commit -ne $env:GITHUB_SHA -or $verification.source_dirty -ne $false -or $verification.review_required -or $verification.runtime_verified) {
            throw 'Verification must describe this exact checkout and its static check only'
          }
      # Only the static report leaves the runner, never game files or indexes.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: game-build-verification
          path: target/game-build-verification.json
          if-no-files-found: ignore

  package:
    name: package (${{ matrix.name }})
    needs: [version, game-build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && !inputs.verify_only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          # The oldest supported Ubuntu, so the binaries also run on
          # distributions with an older C library.
          - name: linux-x64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      # Built into the launcher: the server it plays on, the key its
      # updates must be signed with, and where it looks for them.
      TPF3MP_DEFAULT_SERVER: ${{ vars.TPF3MP_DEFAULT_SERVER }}
      TPF3MP_SERVER_NAME: ${{ vars.TPF3MP_SERVER_NAME }}
      TPF3MP_UPDATE_PUBLIC_KEY: ${{ vars.TPF3MP_UPDATE_PUBLIC_KEY }}
      TPF3MP_REPOSITORY: ${{ github.repository }}
      TPF3MP_DISTRIBUTABLE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history: the build number in the Windows binaries'
          # file version counts its commits (docs/DEVELOPMENT.md, "Which
          # build is this"); a shallow clone has none.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check the settings built in
        shell: bash
        run: |
          set -euo pipefail
          # A bracket expression: "]" first and "-" last are literal.
          if [ -n "$TPF3MP_DEFAULT_SERVER" ] && ! [[ "$TPF3MP_DEFAULT_SERVER" =~ ^[]A-Za-z0-9.:[-]+$ ]]; then
            echo "::error::TPF3MP_DEFAULT_SERVER must be host:port, nothing else"
            exit 1
          fi
          if [ -n "$TPF3MP_SERVER_NAME" ] && ! [[ "$TPF3MP_SERVER_NAME" =~ ^[A-Za-z0-9\ ._-]{1,24}$ ]]; then
            echo "::error::TPF3MP_SERVER_NAME must be a short name such as EU: letters, digits, spaces, dots and dashes"
            exit 1
          fi
          # One key or several, separated by commas or spaces.
          if [ -n "$TPF3MP_UPDATE_PUBLIC_KEY" ] && ! [[ "$TPF3MP_UPDATE_PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{43}=([\ ,]+[A-Za-z0-9+/]{43}=)*$ ]]; then
            echo "::error::TPF3MP_UPDATE_PUBLIC_KEY must be base64 32-byte Ed25519 public keys, separated by commas"
            exit 1
          fi
          if [ -z "$TPF3MP_UPDATE_PUBLIC_KEY" ]; then
            echo "::warning::no TPF3MP_UPDATE_PUBLIC_KEY: these launchers will never update themselves"
          fi
      - name: Build
        run: |
          cargo build --release --locked -p tpf3mp-launcher -p tpf3mp-agent -p tpf3mp-server -p tpf3mp-hook
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          dir="tpf3mp-${VERSION}-${{ matrix.name }}"
          server="tpf3mp-server-${VERSION}-${{ matrix.name }}"
          mkdir -p "$server"
          cp LICENSE docs/OPERATIONS.md "$server/"
          mkdir -p "$dir"
          cp README.md LICENSE docs/PLAYING.md "$dir/"
          # The Lua mod, once the repository has it; the install scripts
          # copy it into the player's mods folder, the only thing they
          # install.
          if [ -d mod/tpf3mp_1 ]; then
            mkdir -p "$dir/mod"
            cp -R mod/tpf3mp_1 "$dir/mod/"
          else
            echo "::notice::no mod/tpf3mp_1 in the repository yet: the package carries no Lua mod"
          fi
          # Tells the launcher's updater this folder is an installed package.
          printf '{"version":"%s","platform":"%s"}\n' "$VERSION" "${{ matrix.name }}" \
            > "$dir/tpf3mp-package.json"
          case "${{ matrix.name }}" in
            windows-*)
              cp target/release/tpf3mp-launcher.exe "$dir/TPF3-MP.exe"
              cp target/release/tpf3mp-agent.exe target/release/tpf3mp_hook.dll "$dir/"
              cp target/release/tpf3mp-server.exe "$server/"
              7z a "$server.zip" "$server" > /dev/null
              echo "server_archive=$server.zip" >> "$GITHUB_ENV"
              # The installer: readable scripts, not a program, so players
              # can see what it changes (docs/DECISIONS.md, D9).
              cp packaging/windows/INSTALL_TPF3MP.cmd packaging/windows/UNINSTALL_TPF3MP.cmd "$dir/"
              mkdir -p "$dir/tools"
              cp packaging/windows/tools/install.ps1 packaging/windows/tools/manage.ps1 "$dir/tools/"
              # The same launcher can bootstrap itself from a single download.
              cp target/release/tpf3mp-launcher.exe TPF3-MP.exe
              7z a "$dir.zip" "$dir" > /dev/null
              echo "archive=$dir.zip" >> "$GITHUB_ENV"
              ;;
            linux-*)
              cp target/release/tpf3mp-launcher target/release/tpf3mp-agent \
                 target/release/libtpf3mp_hook.so \
                 packaging/unix/install.sh packaging/unix/uninstall.sh "$dir/"
              chmod +x "$dir/install.sh" "$dir/uninstall.sh"
              tar czf "$dir.tar.gz" "$dir"
              echo "archive=$dir.tar.gz" >> "$GITHUB_ENV"
              cp target/release/tpf3mp-server "$server/"
              tar czf "$server.tar.gz" "$server"
              echo "server_archive=$server.tar.gz" >> "$GITHUB_ENV"
              ;;
            macos-*)
              app="$dir/TPF3-MP.app/Contents"
              mkdir -p "$app/MacOS"
              cp target/release/tpf3mp-launcher "$app/MacOS/TPF3-MP"
              sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Info.plist"
              # An ad-hoc signature seals the bundle: without one, macOS calls
              # a downloaded app "damaged" instead of offering to open it.
              codesign --force --deep --sign - "$dir/TPF3-MP.app"
              codesign --verify --deep --strict --verbose=2 "$dir/TPF3-MP.app"
              cp target/release/tpf3mp-agent target/release/libtpf3mp_hook.dylib \
                 packaging/unix/install.sh packaging/unix/uninstall.sh "$dir/"
              chmod +x "$dir/install.sh" "$dir/uninstall.sh"
              tar czf "$dir.tar.gz" "$dir"
              echo "archive=$dir.tar.gz" >> "$GITHUB_ENV"
              cp target/release/tpf3mp-server "$server/"
              tar czf "$server.tar.gz" "$server"
              echo "server_archive=$server.tar.gz" >> "$GITHUB_ENV"
              ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.archive }}
            ${{ env.server_archive }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.name == 'windows-x64'
        with:
          name: windows-setup
          path: TPF3-MP.exe
          if-no-files-found: error

  draft:
    name: draft release
    needs: [version, package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Fail closed: a published launcher built without the update key can
      # never update itself, so its players would download every later
      # version by hand. Only a draft can be published; make none.
      - name: Check the release can update itself
        env:
          TPF3MP_UPDATE_PUBLIC_KEY: ${{ vars.TPF3MP_UPDATE_PUBLIC_KEY }}
          TPF3MP_DEFAULT_SERVER: ${{ vars.TPF3MP_DEFAULT_SERVER }}
        run: |
          set -euo pipefail
          if [ -z "$TPF3MP_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::no draft without the repository variable TPF3MP_UPDATE_PUBLIC_KEY: set up the update key (docs/OPERATIONS.md, \"Before the first release\"), then re-run this workflow"
            exit 1
          fi
          if [ -z "$TPF3MP_DEFAULT_SERVER" ]; then
            echo "::error::no draft without the repository variable TPF3MP_DEFAULT_SERVER: it is the launcher's default server, which a release names on purpose (docs/DECISIONS.md, D12). Set it (docs/OPERATIONS.md, \"Before the first release\"), then re-run this workflow"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd packages && sha256sum TPF3-MP.exe *.zip *.tar.gz > SHA256SUMS.txt)
          # A published version is final: releasing again needs a version
          # bump in Cargo.toml. A draft is refreshed with this commit.
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published; bump the version in Cargo.toml"
              exit 1
            fi
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" packages/* \
              --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
              --target "$GITHUB_SHA" --title "TPF3-MP $TAG"
          fi
