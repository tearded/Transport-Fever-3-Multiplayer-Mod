[package]
name = "tpf3mp-launcher"
description = "The TPF3-MP launcher: a native window for players"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
eframe.workspace = true
flate2.workspace = true
image.workspace = true
resvg.workspace = true
ring.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
skrifa.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tpf3mp-agent.workspace = true
tpf3mp-ipc.workspace = true
# Signatures and checked downloads, shared with native mods (proposed D29).
tpf3mp-nativemods = { workspace = true, features = ["install"] }
tpf3mp-proto.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
image = { workspace = true, features = ["ico"] }
tpf3mp-buildinfo.workspace = true

[dev-dependencies]
# wgpu and snapshot render the screens to images for review
# (tests/screenshots.rs).
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
tempfile.workspace = true


[lints]
workspace = true
