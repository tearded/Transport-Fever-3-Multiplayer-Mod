[package]
name = "tpf3mp-hook"
description = "The in-game native hook: platform entry points, profile loading and the agent IPC link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib is the shipped in-game library; rlib lets the logic be unit-tested.
crate-type = ["cdylib", "rlib"]

[dependencies]
tpf3mp-bridge.workspace = true
tpf3mp-hookcore.workspace = true
tpf3mp-ipc.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tpf3mp-proto.workspace = true
ring.workspace = true

[dev-dependencies]
# A real Lua for the link's tests (Lua 5.1, as the workspace builds it).
mlua.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    # The guarded reads' vectored handler (src/image/guarded.rs).
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
] }

[target.'cfg(unix)'.dependencies]
ctor.workspace = true
libc.workspace = true

[build-dependencies]
tpf3mp-buildinfo.workspace = true

[lints]
workspace = true
