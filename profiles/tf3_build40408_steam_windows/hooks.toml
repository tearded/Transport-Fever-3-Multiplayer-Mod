# Signature profile for Transport Fever 3, Steam build 40408 (Windows x64),
# the release build of 2026-09-29.
#
# Made on release day from the installed executable with `tpfre` (docs/DAY_ONE.md
# step 3): TF3 has no __FUNCSIG__ names, so each target was found by carrying
# TPF2's names over with `tpfre match` (shared assert strings, RTTI slots, the
# call graph, source-file order) and checked against the source file TF3's own
# __FILE__ strings name for it. `tpfre q sig --toml` made each block: every
# build-variable byte is wildcarded, and every signature matches exactly once in
# .text. The prologue is the exact bytes the detour engine would relocate. Like
# TPF2's, .text is not encrypted on disk (SteamStub's .bind section only).
#
# GameSim::Step, CGameTime::GetSpeed and the step's call of it are used by the
# hook and confirmed in the running game; the others are static findings
# (investigation/TF3_OFFICIAL_API_2026-09-29.md, "Measured on the release build").
# TF3 sets the speed through the script command makeGameSetSpeedCmd; the getter
# the simulation step reads it through is CGameTime::GetSpeed below.

name = "Transport Fever 3 Build 40408 (Steam, Windows x64)"
image_base = 0x140000000
region = ".text"

[build]
sha256 = "de1daad3a13f3b7e9f79903361bb43769cf4f15e59271a263aefe1f075f23ef2"
size = 69711288
pe_timestamp = 0x6AB69FE5

# GameSim::Step (TPF2 0x15aa00; here 0x159390): the per-batch simulation entry.
# Matched by three assert strings it alone uses in both builds; TF3 names
# game/gamesim.cpp for it.
[[target]]
name = "GameSim::Step"
signature = "40 55 41 56 48 83 EC 48 4C 8B F2 48 8B E9"
offset = 0
prologue = "40 55 41 56 48 83 EC 48 4C 8B F2 48 8B E9"
required = true

# CGame::Step (TPF2 0x118e90; here 0x11f3b0): the main-thread pacing entry.
# Two shared assert strings; game/game.cpp.
[[target]]
name = "CGame::Step"
signature = "40 53 48 83 EC 20 48 8B 81 F0 01 00 00 48 8B D9"
offset = 0
prologue = "40 53 48 83 EC 20 48 8B 81 F0 01 00 00 48 8B D9"
required = true

# CGameTime::GetSpeed (TPF2 0x2877a0; here 0x2a95a0): the speed GameSim::Step
# reads, in updates per call (GameSpeed.speedup). Not matched by name: it is
# the getter GameSim::Step calls before its update loop, 27 bytes returning the
# component's speedup, in gametime.cpp, as TPF2's. The hook only reads it here
# (the speed row's value, the player's request to the room); the UI and the
# particles read it too, so it is never changed for them.
[[target]]
name = "CGameTime::GetSpeed"
signature = "48 83 EC 28 48 8B 41 10 48 8B 49 08 8B 10 E8 ?? ?? ?? ?? 8B 40 04"
offset = 0
prologue = "48 83 EC 28 48 8B 41 10 48 8B 49 08 8B 10"
required = true

# GameSim::Step's own call of CGameTime::GetSpeed (here 0x1593ee, step + 0x5e),
# the only one of its seven callers inside the step: `mov rcx,[rbp+8]; mov
# rcx,[rcx+0x28]; call GetSpeed; cmp eax,ebx; mov r12d,eax`. In a room's game
# the hook redirects this one call to answer 1, so one call of the step is one
# update (HOOKS.md, "The step gate in the game"), as TPF2MP patched the step's
# calls and not the getter. The hook also checks the call targets GetSpeed.
[[target]]
name = "GameSim::Step/GetSpeed call"
signature = "48 8B 4D 08 48 8B 49 28 E8 ?? ?? ?? ?? 3B C3 44 8B E0"
offset = 8
prologue = "E8"
required = true

