[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.2.8"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Juliansgith/Transport-Fever-3-Multiplayer-Mod"
publish = false

[workspace.dependencies]
tpf3mp-proto = { path = "crates/tpf3mp-proto" }
tpf3mp-net = { path = "crates/tpf3mp-net" }
tpf3mp-agent = { path = "crates/tpf3mp-agent" }
tpf3mp-server = { path = "crates/tpf3mp-server" }
tpf3mp-hookcore = { path = "crates/tpf3mp-hookcore" }
tpf3mp-ipc = { path = "crates/tpf3mp-ipc" }
tpf3mp-snapshot = { path = "crates/tpf3mp-snapshot" }
tpf3mp-bridge = { path = "crates/tpf3mp-bridge" }
tpf3mp-launch = { path = "crates/tpf3mp-launch" }
tpf3mp-modscan = { path = "crates/tpf3mp-modscan" }
tpf3mp-buildinfo = { path = "crates/tpf3mp-buildinfo" }
# The hook takes it without the installer; the launcher adds `install`.
tpf3mp-nativemods = { path = "crates/tpf3mp-nativemods", default-features = false }

anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.2"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
getrandom = "0.4.3"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# The ring provider keeps Windows builds free of the CMake/NASM toolchain that
# aws-lc-rs needs. QUIC only negotiates TLS 1.3, so tls12 stays off.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14.10"
# Already built for rustls; used directly for identity keys and HMAC.
ring = "0.17.14"
rustls ={ version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "fs", "io-util"] }
# QUIC over WebSocket for networks that block UDP. TLS goes through
# tokio-rustls with the same ring provider as QUIC, not tungstenite's own.
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# The launcher's native window, and its UI tests.
eframe = "0.36.2"
egui_kittest = "0.36.2"
# The font parser egui uses, to check a system font before egui gets it.
skrifa = "0.44.0"
# The launcher's images (PNG and JPEG) and its icons (SVG).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.45", default-features = false }
# The launcher's log files.
tracing-appender = "0.2.5"
# The launcher's updater: HTTPS with the same rustls and ring as the rest,
# the release archives, and version order.
flate2 = "1.1.10"
semver = "1.0.28"
tar = "0.4.46"
ureq = "3.4.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
webpki-roots = "1.0.9"

# tpf3mp-canon
# Test-only: the differential tests run TPF2MP's original Lua economy next to
# the Rust port. TPF2MP targets Lua 5.1, where every number is a double, so the
# vendored interpreter must be 5.1 (5.3+ would add integer semantics).
mlua = { version = "0.12.1", features = ["lua51", "vendored"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

# hook crates: the in-process native hook, its build-signature/detour engine and
# the shared-memory link to the agent. The platform crates (ctor, libc,
# windows-sys) and iced-x86 are pulled in only under the cfg() targets that need
# them; see each crate's [target.'cfg(...)'.dependencies].
ctor = "1.0.13"
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "instr_info"] }
libc = "0.2.189"
sha2 = "0.11.0"
toml = "1.1.6"
windows-sys = "0.61.2"

# tpf3mp-snapshot
blake3 = "1.8.7"
fastcdc = "5.0.0"
tempfile = "3.27.0"
# Without default features zstd leaves out the dictionary builder and the
# decoders for pre-1.0 frame formats. Chunks arrive from untrusted peers, and
# the legacy decoders would only widen what they can reach.
zstd = { version = "0.14.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Unoptimized zstd runs at a tenth of its speed, which slows every debug build
# and test that touches snapshots.
[profile.dev.package.zstd-sys]
opt-level = 3
