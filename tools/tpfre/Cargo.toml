[package]
name = "tpfre"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Static binary-analysis kit for decoding a game executable: one fast indexer into SQLite, and a query CLI for agents."

# Its own workspace, so the main workspace's CI and lockfile stay as they are.
[workspace]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
memchr = "2.8.3"
msvc-demangler = "0.11.0"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tpf3mp-hookcore = { path = "../../crates/tpf3mp-hookcore" }
serde = { version = "1.0.229", features = ["derive"] }
flate2 = "1.1.10"
crc32fast = "1.5.2"
tempfile = "3.27.0"

# As the main workspace's.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
